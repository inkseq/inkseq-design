name: Publish synthetic progress preview
on:
  push:
    branches: [codex/progress-preview251-20261017]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: progress-preview-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio-app/package-lock.json
      - run: npm ci
        working-directory: studio-app
      - run: node --test progress-preview/transport.test.js
        working-directory: studio-app
      - run: node progress-preview/build.mjs
        working-directory: studio-app
        env:
          PREVIEW_BUILD: ${{ github.sha }}
      - run: node progress-preview/check-build.mjs
        working-directory: studio-app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .progress-site
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

